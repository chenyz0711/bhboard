<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>兄弟公告 · BHBoard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f5f5f5;
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex; justify-content: center;
      padding: 40px 20px; min-height: 100vh;
    }
    .container { max-width: 640px; width: 100%; }
    .header { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .header h1 { font-size: 26px; font-weight: 700; color: #1a1a1a; }
    .header h1 span { color: #999; font-weight: 400; font-size: 14px; margin-left: 8px; }
    .back {
      font-size: 13px; color: #999; background: none; border: 1px solid #e0e0e0;
      padding: 6px 14px; border-radius: 999px; text-decoration: none;
    }
    .back:hover { color: #1a1a1a; border-color: #1a1a1a; }

    .board {
      background: #fff; border: 1px solid #eee; border-radius: 12px;
      padding: 18px 20px 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .board-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .btab {
      font-size: 13px; padding: 7px 14px; border-radius: 999px; cursor: pointer;
      background: #fafafa; border: 1px solid #e5e5e5; color: #777; transition: .15s;
    }
    .btab:hover { color: #1a1a1a; border-color: #ccc; }
    .btab.active { background: #1a1a1a; border-color: #1a1a1a; color: #fff; }
    .bpane { max-height: 66vh; overflow-y: auto; }

    .log-list { font-size: 13px; color: #555; }
    .log-item { padding: 12px 0; border-bottom: 1px solid #f2f2f2; }
    .log-item:last-child { border-bottom: none; }
    .log-date {
      display: inline-block; font-size: 11px; color: #fff; background: #1a1a1a;
      padding: 2px 8px; border-radius: 6px; margin-right: 8px;
    }
    .log-title { font-weight: 600; color: #1a1a1a; }
    .log-body { margin: 6px 0 0; padding-left: 2px; line-height: 1.8; color: #666; }
    .log-body li { margin-left: 16px; margin-bottom: 2px; }

    .notice-body { font-size: 14px; color: #333; line-height: 1.85; white-space: pre-wrap; word-break: break-word; }
    .notice-body.empty { color: #bbb; font-style: italic; }
    .notice-edit { margin-top: 14px; padding-top: 14px; border-top: 1px dashed #e5e5e5; }
    .notice-edit textarea {
      width: 100%; padding: 10px 12px; border: 1px solid #e0e0e0; border-radius: 8px;
      font-size: 13px; font-family: inherit; outline: none; background: #fafafa; resize: vertical;
    }
    .notice-edit textarea:focus { border-color: #1a1a1a; background: #fff; }
    .notice-acts { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .btn-main {
      padding: 9px 20px; background: #1a1a1a; color: #fff; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: .15s;
    }
    .btn-main:hover { background: #333; }
    .btn-main:disabled { background: #bbb; cursor: not-allowed; }
    .notice-tip { font-size: 12px; color: #999; }
    .notice-meta { font-size: 11px; color: #bbb; margin-top: 10px; }

    .docs-frame { width: 100%; height: 60vh; border: 1px solid #eee; border-radius: 10px; background: #0f1626; }
    .docs-note { font-size: 12px; color: #999; margin-top: 8px; }
    .docs-note a { color: #1a1a1a; }

    .footer { text-align: center; color: #ddd; font-size: 12px; margin-top: 20px; }
    .hidden { display: none !important; }
    @media (max-width: 480px) { body { padding: 20px 12px; } }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📋 兄弟公告 <span># BHBoard</span></h1>
    <a class="back" href="/">← 回主页</a>
  </div>

  <div class="board">
    <div class="board-tabs">
      <button class="btab active" data-tab="log">📝 修改日志</button>
      <button class="btab" data-tab="notice">📢 公告</button>
      <button class="btab" data-tab="docs">🗺️ 架构文档</button>
    </div>

    <div class="bpane" id="pane-log">
      <div class="log-list" id="logList"></div>
    </div>

    <div class="bpane hidden" id="pane-notice">
      <div class="notice-body" id="noticeBody">加载中…</div>
      <div class="notice-edit hidden" id="noticeEdit">
        <textarea id="noticeInput" rows="6" maxlength="2000" placeholder="写点公告…（支持换行）"></textarea>
        <div class="notice-acts">
          <button class="btn-main" id="noticeSave">保存公告</button>
          <span class="notice-tip" id="noticeTip"></span>
        </div>
      </div>
      <div class="notice-meta" id="noticeMeta"></div>
    </div>

    <div class="bpane hidden" id="pane-docs">
      <iframe class="docs-frame" id="docsFrame" title="架构文档" loading="lazy"></iframe>
      <div class="docs-note">也可以在新窗口打开：<a href="/docs/" target="_blank" rel="noopener">/docs/</a></div>
    </div>
  </div>

  <div class="footer">BHBoard · 兄弟公告 · made by j2k183 chenyz howiehw</div>
</div>

<script src="/keycheck.js"></script>

  function renderChangelog() {
    logList.innerHTML = '';
    CHANGELOG.forEach(entry => {
      const item = document.createElement('div');
      item.className = 'log-item';
      const head = document.createElement('div');
      const d = document.createElement('span'); d.className = 'log-date'; d.textContent = entry.date;
      const t = document.createElement('span'); t.className = 'log-title'; t.textContent = entry.title;
      head.appendChild(d); head.appendChild(t);
      const body = document.createElement('div'); body.className = 'log-body';
      const ul = document.createElement('ul');
      entry.items.forEach(x => { const li = document.createElement('li'); li.textContent = x; ul.appendChild(li); });
      body.appendChild(ul);
      item.appendChild(head); item.appendChild(body);
      logList.appendChild(item);
    });
  }

  function fmtTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  async function loadNotice() {
    let data = null;
    try {
      const res = await fetch(`${UPSTASH_URL}/get/${NOTICE_KEY}`, {
        headers: { 'Authorization': `Bearer ${UPSTASH_TOKEN}` }
      });
      const j = await res.json();
      if (j.result) data = JSON.parse(j.result);
    } catch (e) {}
    const text = (data && data.text) ? data.text : '';
    noticeBody.textContent = text || '还没有公告';
    noticeBody.classList.toggle('empty', !text);
    noticeMeta.textContent = (data && data.at)
      ? `最后编辑：${data.by || '管理员'} · ${fmtTime(data.at)}`
      : '';
    const u = getUser();
    const canEdit = !!(u && window.KeyGate.isAdmin(u.username));
    noticeEdit.classList.toggle('hidden', !canEdit);
    if (canEdit) noticeInput.value = text;
  }

  noticeSave.addEventListener('click', async () => {
    const u = getUser();
    if (!u || !window.KeyGate.isAdmin(u.username)) {
      noticeTip.textContent = '只有管理员能编辑';
      return;
    }
    noticeSave.disabled = true;
    noticeTip.textContent = '保存中…';
    try {
      const payload = JSON.stringify({ text: noticeInput.value.trim(), by: u.username, at: Date.now() });
      const res = await fetch(`${UPSTASH_URL}/set/${NOTICE_KEY}/${encodeURIComponent(payload)}`, {
        method: 'POST', headers: { 'Authorization': `Bearer ${UPSTASH_TOKEN}` }
      });
      if (!res.ok) throw new Error('写入失败');
      noticeTip.textContent = '已保存';
      await loadNotice();
    } catch (e) {
      noticeTip.textContent = '保存失败：' + e.message;
    }
    noticeSave.disabled = false;
    setTimeout(() => { if (noticeTip.textContent === '已保存') noticeTip.textContent = ''; }, 2500);
  });

  // 标签切换（文档 iframe 延迟加载）
  let docsLoaded = false;
  boardTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      boardTabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const name = tab.dataset.tab;
      document.getElementById('pane-log').classList.toggle('hidden', name !== 'log');
      document.getElementById('pane-notice').classList.toggle('hidden', name !== 'notice');
      document.getElementById('pane-docs').classList.toggle('hidden', name !== 'docs');
      if (name === 'docs' && !docsLoaded) { docsFrame.src = '/docs/'; docsLoaded = true; }
    });
  });

  (function init(){
    if (!window.KeyGate.requireLogin()) return;
    renderChangelog();
    loadNotice();
  })();
</script>
</body>
</html>
